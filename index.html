<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KŌROKU 行録 — Anime Tracker</title>
<meta name="description" content="KŌROKU — track what you're watching, keep what you want to.">
<meta name="theme-color" content="#0B0C0D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<style>
  :root{
    /* ---- KŌROKU token system ---- */
    --ink-0:#0a0b0c;        /* charcoal black, deepest ground */
    --ink-1:#121417;        /* dark slate, panels */
    --ink-2:#1b1e22;        /* dark slate, raised */
    --line-1:#2a2e33;       /* hairline on dark */
    --sandal-0:#cdb79a;     /* warm sandalwood */
    --sandal-1:#e7dac4;     /* pale sandal (light-mode ground) */
    --paper:#f6f2ea;        /* crisp warm white */
    --jade-0:#2f6f56;       /* deep jade */
    --jade-1:#5fb894;       /* jade glow */
    --jade-2:#a9e8cf;       /* jade highlight */
    --ink-text:#e9e4da;     /* body text on dark */
    --ink-text-dim:#8b8d90;
    --font-display:'Shippori Mincho', serif;
    --font-body:'Noto Sans JP','Inter',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }

  html.light{
    --ink-0:var(--paper);
    --ink-1:#efe8db;
    --ink-2:#e5dbc9;
    --line-1:#d8cbb2;
    --ink-text:#242220;
    --ink-text-dim:#847d6f;
  }

  *{ -webkit-tap-highlight-color: transparent; }
  html,body{
    background:var(--ink-0);
    color:var(--ink-text);
    font-family:var(--font-body);
    overscroll-behavior:none;
    height:100%;
    transition:background .5s ease, color .5s ease;
  }
  body{ margin:0; }

  ::selection{ background:var(--jade-1); color:var(--ink-0); }

  .font-display{ font-family:var(--font-display); }
  .font-mono{ font-family:var(--font-mono); }

  /* ============ INTRO ============ */
  #intro{
    position:fixed; inset:0; z-index:100;
    background:var(--ink-0);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #intro.fade-out{
    animation:introOut .9s cubic-bezier(.65,0,.35,1) forwards;
  }
  @keyframes introOut{
    0%{ opacity:1; filter:blur(0px); }
    100%{ opacity:0; filter:blur(6px); pointer-events:none; }
  }

  .vignette{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(95,184,148,0.10), transparent 55%),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.65) 78%);
    pointer-events:none;
  }

  /* faint architectural glyph wings, mirrored */
  .glyph-wing{
    position:absolute; top:50%; transform:translateY(-50%);
    width:min(38vw,520px); height:auto;
    opacity:.16;
    stroke:var(--sandal-0);
  }
  .glyph-wing.left{ left:2%; }
  .glyph-wing.right{ right:2%; transform:translateY(-50%) scaleX(-1); }

  .center-hair{
    position:absolute; left:50%; top:0; bottom:0; width:1px;
    background:linear-gradient(to bottom, transparent 0%, rgba(207,192,163,.35) 20%, rgba(207,192,163,.35) 80%, transparent 100%);
    transform:translateX(-50%);
  }

  .intro-stack{
    position:relative; display:flex; flex-direction:column; align-items:center;
    gap:18px; z-index:2;
  }

  .rune-top{
    writing-mode:vertical-rl;
    font-family:var(--font-display);
    letter-spacing:.4em;
    font-size:13px;
    color:var(--sandal-0);
    opacity:.55;
    margin-bottom:26px;
    animation:runeFlicker 4s ease-in-out infinite;
  }
  @keyframes runeFlicker{
    0%,100%{ opacity:.55 } 50%{ opacity:.85 }
  }

  /* jade band */
  .jade-band{
    position:relative;
    width:min(92vw,760px);
    height:64px;
    overflow:hidden;
    border-top:1px solid rgba(169,232,207,.25);
    border-bottom:1px solid rgba(169,232,207,.25);
  }
  .jade-band::before{
    content:"";
    position:absolute; inset:-40% -10%;
    background:
      radial-gradient(closest-side at 20% 40%, rgba(95,184,148,.55), transparent 60%),
      radial-gradient(closest-side at 65% 60%, rgba(47,111,86,.6), transparent 55%),
      radial-gradient(closest-side at 85% 30%, rgba(169,232,207,.4), transparent 55%),
      linear-gradient(120deg, #123028, #1f5442 30%, #0d2620 55%, #2c6b53 75%, #0f2b23);
    filter:blur(6px) saturate(1.15);
    animation:marble 14s linear infinite alternate;
  }
  @keyframes marble{
    0%{ transform:translate(-4%,-2%) rotate(0deg) scale(1.05); }
    100%{ transform:translate(4%,3%) rotate(1.2deg) scale(1.12); }
  }
  .jade-band .lattice{
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 46px);
    mix-blend-mode:overlay;
  }
  .jade-mark{
    position:absolute; left:50%; top:50%;
    width:34px; height:34px;
    transform:translate(-50%,-50%);
    border:1px solid rgba(230,230,220,.55);
    outline:1px solid rgba(230,230,220,.55);
    outline-offset:3px;
    background:rgba(15,20,18,.4);
    display:grid; place-items:center;
  }
  .jade-mark::before{ content:"卍"; font-size:14px; color:var(--paper); opacity:.7; font-family:var(--font-display); }
  .jade-mark.left-mark{ left:14%; width:26px; height:26px; }
  .jade-mark.right-mark{ left:86%; width:26px; height:26px; }

  /* emblem */
  .emblem-wrap{
    position:relative; margin-top:-46px; z-index:3;
    width:150px; height:150px;
    display:flex; align-items:center; justify-content:center;
    filter:drop-shadow(0 0 18px rgba(169,232,207,.55)) drop-shadow(0 0 40px rgba(95,184,148,.25));
  }
  .emblem-wrap svg{ width:100%; height:100%; }
  .emblem-path{
    fill:none;
    stroke:var(--paper);
    stroke-width:2.4;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:900;
    stroke-dashoffset:900;
    animation:drawEmblem 2.6s cubic-bezier(.3,.6,.2,1) forwards .15s, emberGlow 2.4s ease-in-out infinite 2.4s;
  }
  @keyframes drawEmblem{ to{ stroke-dashoffset:0; } }
  @keyframes emberGlow{
    0%,100%{ filter:drop-shadow(0 0 2px rgba(169,232,207,.4)); }
    50%{ filter:drop-shadow(0 0 10px rgba(169,232,207,.9)); }
  }

  .pct-row{
    margin-top:10px;
    display:flex; align-items:baseline; gap:10px;
    font-family:var(--font-mono);
  }
  .pct-num{
    font-size:22px; font-weight:400; letter-spacing:.05em;
    color:var(--paper);
    min-width:64px; text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .pct-label{
    font-size:10px; letter-spacing:.35em; text-transform:uppercase;
    color:var(--ink-text-dim);
  }

  .dot-grid{
    margin-top:22px;
    display:grid; grid-template-columns:repeat(3,7px); gap:5px;
  }
  .dot-grid span{
    width:7px; height:7px; border:1px solid rgba(207,192,163,.55);
  }
  .dot-grid span:nth-child(odd){ background:rgba(207,192,163,.15); }

  .baseline-glyphs{
    margin-top:16px;
    font-family:var(--font-mono);
    font-size:10px; letter-spacing:.15em;
    color:var(--ink-text-dim);
    display:flex; align-items:center; gap:8px;
  }
  .baseline-glyphs .spark{ color:#b8544a; font-size:8px; }

  .side-text{
    position:absolute;
    writing-mode:vertical-rl;
    font-family:var(--font-display);
    font-size:11px; letter-spacing:.3em;
    color:var(--ink-text-dim);
    opacity:.5;
  }
  .side-text.tl{ top:12%; left:6%; }
  .side-text.br{ bottom:8%; right:6%; }

  @media (max-width:640px){
    .jade-band{ height:48px; }
    .emblem-wrap{ width:110px; height:110px; margin-top:-34px; }
    .glyph-wing{ opacity:.09; }
    .side-text{ display:none; }
  }

  /* ============ APP SHELL ============ */
  #app{
    opacity:0;
    min-height:100dvh;
    display:flex; flex-direction:column;
    transition:opacity .8s ease .1s;
  }
  #app.visible{ opacity:1; }

  header.app-header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px;
    padding-top:calc(14px + env(safe-area-inset-top));
    background:color-mix(in srgb, var(--ink-0) 88%, transparent);
    backdrop-filter:blur(14px) saturate(1.1);
    border-bottom:1px solid var(--line-1);
  }
  .icon-btn{
    width:40px; height:40px;
    display:grid; place-items:center;
    border:1px solid var(--line-1);
    background:var(--ink-1);
    color:var(--ink-text);
    transition:border-color .25s ease, background .25s ease, transform .15s ease;
  }
  .icon-btn:hover{ border-color:var(--jade-1); }
  .icon-btn:active{ transform:scale(.94); }
  .icon-btn svg{ width:18px; height:18px; stroke-width:1.5; }

  .brand{
    display:flex; flex-direction:column; align-items:center; line-height:1;
  }
  .brand .cn{
    font-family:var(--font-display);
    font-size:12px; letter-spacing:.5em;
    color:var(--jade-1);
    margin-bottom:4px;
  }
  .brand .en{
    font-family:var(--font-display);
    font-size:19px; letter-spacing:.32em;
    color:var(--ink-text);
  }

  .header-right{ display:flex; align-items:center; gap:8px; }

  main.app-main{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    padding:40px 20px 80px;
  }
  .empty-state{
    text-align:center; max-width:420px;
  }
  .empty-state .mark{
    width:56px; height:56px; margin:0 auto 22px;
    border:1px solid var(--line-1);
    display:grid; place-items:center;
    color:var(--jade-1);
  }
  .empty-state h2{
    font-family:var(--font-display);
    font-size:22px; letter-spacing:.08em;
    margin-bottom:10px;
  }
  .empty-state p{
    font-size:13.5px; color:var(--ink-text-dim); line-height:1.7;
  }
  .empty-state .cta{
    margin-top:26px;
    display:inline-flex; align-items:center; gap:8px;
    padding:11px 24px;
    border:1px solid var(--jade-1);
    color:var(--jade-2);
    font-size:12.5px; letter-spacing:.12em;
    background:transparent;
    cursor:pointer;
    transition:background .25s ease, color .25s ease;
  }
  .empty-state .cta:hover{ background:var(--jade-0); color:var(--paper); }

  /* genre / menu drawers */
  .drawer{
    position:fixed; top:0; bottom:0; width:min(84vw,320px);
    background:var(--ink-1);
    border-right:1px solid var(--line-1);
    z-index:40;
    padding:calc(20px + env(safe-area-inset-top)) 22px 20px;
    transition:transform .45s cubic-bezier(.2,.8,.2,1);
    overflow-y:auto;
  }
  #genreDrawer{ left:0; transform:translateX(-105%); border-right:1px solid var(--line-1); border-left:none;}
  #genreDrawer.open{ transform:translateX(0); }
  #menuDrawer{ right:0; left:auto; transform:translateX(105%); border-left:1px solid var(--line-1); border-right:none; }
  #menuDrawer.open{ transform:translateX(0); }

  .drawer h3{
    font-family:var(--font-display); letter-spacing:.2em; font-size:14px;
    color:var(--ink-text-dim); margin-bottom:18px;
    padding-bottom:12px; border-bottom:1px solid var(--line-1);
  }
  .drawer ul{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:2px; }
  .drawer li a{
    display:block; padding:11px 4px;
    font-size:14px; color:var(--ink-text);
    border-bottom:1px solid var(--line-1);
    text-decoration:none;
    transition:color .2s ease, padding-left .2s ease;
  }
  .drawer li a:hover{ color:var(--jade-1); padding-left:8px; }

  .scrim{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    backdrop-filter:blur(2px);
    z-index:30; opacity:0; pointer-events:none;
    transition:opacity .35s ease;
  }
  .scrim.show{ opacity:1; pointer-events:auto; }

  /* ============ CONTROL BAR (search + active genre) ============ */
  .control-bar{
    position:sticky; top:69px; z-index:15;
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    padding:14px 18px;
    background:color-mix(in srgb, var(--ink-0) 88%, transparent);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line-1);
  }
  .search-field{
    position:relative;
    flex:1 1 240px; max-width:480px;
  }
  .search-field input{
    width:100%;
    background:var(--ink-1);
    border:1px solid var(--line-1);
    color:var(--ink-text);
    font-family:var(--font-body);
    font-size:13.5px;
    padding:10px 14px 10px 38px;
    outline:none;
    transition:border-color .25s ease;
  }
  .search-field input::placeholder{ color:var(--ink-text-dim); }
  .search-field input:focus{ border-color:var(--jade-1); }
  .search-field .search-icon{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; color:var(--ink-text-dim); pointer-events:none;
  }
  .search-field .search-icon svg{ width:15px; height:15px; stroke-width:1.5; }

  .filter-chip{
    display:none;
    align-items:center; gap:8px;
    padding:8px 12px;
    border:1px solid var(--jade-1);
    color:var(--jade-2);
    font-size:12px; letter-spacing:.06em;
    font-family:var(--font-mono);
    background:color-mix(in srgb, var(--jade-0) 18%, transparent);
  }
  .filter-chip.show{ display:inline-flex; }
  .filter-chip button{
    display:grid; place-items:center;
    background:none; border:none; color:inherit; cursor:pointer; padding:0;
  }
  .filter-chip button svg{ width:13px; height:13px; }

  .results-label{
    font-family:var(--font-mono);
    font-size:11px; letter-spacing:.1em;
    color:var(--ink-text-dim);
    padding:0 18px;
    margin-top:14px;
  }

  /* ============ GRID + CARDS ============ */
  .anime-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:16px 14px;
    padding:16px 18px 10px;
  }
  @media (min-width:560px){ .anime-grid{ grid-template-columns:repeat(3, 1fr); } }
  @media (min-width:820px){ .anime-grid{ grid-template-columns:repeat(4, 1fr); gap:20px; padding:20px 28px 10px; } }
  @media (min-width:1140px){ .anime-grid{ grid-template-columns:repeat(5, 1fr); } }
  @media (min-width:1440px){ .anime-grid{ grid-template-columns:repeat(6, 1fr); } }

  .anime-card{
    display:flex; flex-direction:column;
    cursor:pointer;
    opacity:0; transform:translateY(10px);
    animation:cardIn .5s ease forwards;
    background:none; border:none; padding:0; margin:0; text-align:left;
    font-family:inherit; color:inherit;
  }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0); } }

  .anime-card .poster{
    position:relative;
    aspect-ratio:2/3;
    background:var(--ink-1);
    border:1px solid var(--line-1);
    overflow:hidden;
    transition:border-color .3s ease;
  }
  .anime-card:hover .poster{ border-color:var(--jade-1); }
  .anime-card .poster img{
    width:100%; height:100%; object-fit:cover;
    display:block;
    filter:saturate(.92) contrast(1.02);
    transition:transform .6s cubic-bezier(.2,.7,.2,1), filter .4s ease;
  }
  .anime-card:hover .poster img{ transform:scale(1.06); filter:saturate(1.05) contrast(1.05); }

  .anime-card .poster .score{
    position:absolute; top:6px; right:6px;
    display:flex; align-items:center; gap:4px;
    background:rgba(10,11,12,.72);
    border:1px solid rgba(207,192,163,.3);
    color:var(--sandal-0);
    font-family:var(--font-mono);
    font-size:10.5px;
    padding:3px 6px;
    backdrop-filter:blur(4px);
  }
  .anime-card .poster .score svg{ width:10px; height:10px; fill:var(--jade-1); stroke:var(--jade-1); }

  .anime-card .poster::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(to top, rgba(0,0,0,.55), transparent 45%);
    opacity:0; transition:opacity .3s ease;
  }
  .anime-card:hover .poster::after{ opacity:1; }

  .anime-card .title{
    margin-top:9px;
    font-size:12.5px; line-height:1.4;
    color:var(--ink-text);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .anime-card .meta{
    margin-top:3px;
    font-family:var(--font-mono);
    font-size:10px; letter-spacing:.05em;
    color:var(--ink-text-dim);
  }

  /* skeleton loading */
  .anime-card.skeleton .poster{ position:relative; overflow:hidden; }
  .anime-card.skeleton .poster::before{
    content:""; position:absolute; inset:0;
    background:linear-gradient(100deg, transparent 30%, rgba(207,192,163,.09) 50%, transparent 70%);
    background-size:200% 100%;
    animation:shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer{ 0%{ background-position:140% 0; } 100%{ background-position:-40% 0; } }
  .anime-card.skeleton .title{ height:11px; width:85%; background:var(--ink-1); }
  .anime-card.skeleton .meta{ height:9px; width:45%; background:var(--ink-1); margin-top:6px; }

  .grid-state{
    text-align:center; padding:60px 20px;
    color:var(--ink-text-dim);
    font-size:13px;
    grid-column:1/-1;
  }
  .grid-state .mark{ margin:0 auto 16px; width:44px; height:44px; border:1px solid var(--line-1); display:grid; place-items:center; color:var(--jade-1); }

  /* ============ PAGINATION ============ */
  .pagination{
    display:flex; align-items:center; justify-content:center;
    flex-wrap:wrap; gap:6px;
    padding:26px 18px 60px;
  }
  .page-btn{
    min-width:34px; height:34px;
    padding:0 8px;
    display:grid; place-items:center;
    border:1px solid var(--line-1);
    background:var(--ink-1);
    color:var(--ink-text-dim);
    font-family:var(--font-mono);
    font-size:12px;
    cursor:pointer;
    transition:border-color .2s ease, color .2s ease, background .2s ease;
  }
  .page-btn:hover:not(:disabled){ border-color:var(--jade-1); color:var(--ink-text); }
  .page-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .page-btn.active{
    background:var(--jade-0); border-color:var(--jade-0); color:var(--paper);
  }
  .page-ellipsis{
    color:var(--ink-text-dim); font-family:var(--font-mono); font-size:12px;
    padding:0 4px;
  }

  /* ============ GENRE OVERLAY ============ */
  .genre-list{
    display:flex; flex-direction:column; gap:2px;
  }
  .genre-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 4px;
    font-size:14px; color:var(--ink-text);
    border-bottom:1px solid var(--line-1);
    cursor:pointer;
    background:none; border-left:none; border-right:none; border-top:none;
    width:100%; text-align:left;
    font-family:var(--font-body);
    transition:color .2s ease, padding-left .2s ease;
  }
  .genre-item:hover{ color:var(--jade-1); padding-left:8px; }
  .genre-item.active{ color:var(--jade-1); }
  .genre-item .count{
    font-family:var(--font-mono); font-size:10.5px; color:var(--ink-text-dim);
  }
  .genre-loading{
    font-family:var(--font-mono); font-size:11px; color:var(--ink-text-dim);
    letter-spacing:.1em; padding:20px 4px;
  }

  /* ============ DETAIL MODAL ============ */
  .modal-backdrop{
    position:fixed; inset:0; z-index:60;
    background:color-mix(in srgb, var(--ink-0) 72%, transparent);
    backdrop-filter:blur(0px) saturate(1);
    -webkit-backdrop-filter:blur(0px) saturate(1);
    opacity:0;
    display:flex; align-items:flex-end; justify-content:center;
    pointer-events:none;
    transition:opacity .5s cubic-bezier(.22,.61,.36,1),
               backdrop-filter .55s cubic-bezier(.22,.61,.36,1),
               -webkit-backdrop-filter .55s cubic-bezier(.22,.61,.36,1);
  }
  @media (min-width:760px){ .modal-backdrop{ align-items:center; padding:32px; } }
  .modal-backdrop.open{
    opacity:1;
    backdrop-filter:blur(14px) saturate(1.05);
    -webkit-backdrop-filter:blur(14px) saturate(1.05);
    pointer-events:auto;
  }

  .modal-panel{
    position:relative;
    width:100%; max-width:840px;
    max-height:92vh; max-height:92dvh;
    background:var(--ink-1);
    border:1px solid var(--line-1);
    border-bottom:none;
    overflow:hidden;
    display:flex; flex-direction:column;
    transform:translateY(28px) scale(.98);
    opacity:0;
    transition:transform .5s cubic-bezier(.22,.61,.36,1), opacity .45s cubic-bezier(.22,.61,.36,1);
  }
  @media (min-width:760px){
    .modal-panel{ border-bottom:1px solid var(--line-1); max-height:88vh; }
  }
  .modal-backdrop.open .modal-panel{
    transform:translateY(0) scale(1);
    opacity:1;
  }
  .modal-backdrop.closing{
    opacity:0;
    backdrop-filter:blur(0px) saturate(1);
    -webkit-backdrop-filter:blur(0px) saturate(1);
  }
  .modal-backdrop.closing .modal-panel{
    transform:translateY(18px) scale(.97);
    opacity:0;
    transition:transform .38s cubic-bezier(.4,0,.68,.06), opacity .32s ease;
  }

  .modal-scroll{
    overflow-y:auto;
    overscroll-behavior:contain;
  }

  .modal-close{
    position:absolute; top:14px; right:14px; z-index:5;
    width:36px; height:36px;
    display:grid; place-items:center;
    background:rgba(10,11,12,.55);
    border:1px solid rgba(207,192,163,.35);
    color:var(--paper);
    backdrop-filter:blur(6px);
    cursor:pointer;
    transition:border-color .2s ease, transform .15s ease;
  }
  .modal-close:hover{ border-color:var(--jade-1); }
  .modal-close:active{ transform:scale(.92); }
  .modal-close svg{ width:16px; height:16px; }

  .modal-hero{
    position:relative;
    display:grid;
    grid-template-columns:120px 1fr;
    gap:18px;
    padding:22px 20px 18px;
    border-bottom:1px solid var(--line-1);
  }
  @media (min-width:560px){
    .modal-hero{ grid-template-columns:170px 1fr; padding:28px 30px 22px; gap:24px; }
  }
  .modal-hero .backdrop-fade{
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, transparent 0%, var(--ink-1) 96%),
      linear-gradient(90deg, var(--ink-1) 0%, transparent 55%);
    pointer-events:none;
  }
  .modal-hero .poster-img{
    position:relative;
    width:100%; aspect-ratio:2/3;
    object-fit:cover;
    border:1px solid var(--line-1);
    background:var(--ink-2);
  }
  .modal-hero-info{ position:relative; min-width:0; padding-top:2px; }
  .modal-hero-info .jp-title{
    font-family:var(--font-display); font-size:12px; letter-spacing:.15em;
    color:var(--jade-1); margin-bottom:6px;
  }
  .modal-hero-info h2{
    font-family:var(--font-display); font-size:20px; line-height:1.3;
    letter-spacing:.02em; margin:0 0 10px;
  }
  @media (min-width:560px){ .modal-hero-info h2{ font-size:25px; } }

  .modal-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .modal-tag{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.05em;
    padding:4px 9px;
    border:1px solid var(--line-1);
    color:var(--ink-text-dim);
  }

  .stat-row{
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px 16px;
  }
  @media (min-width:560px){ .stat-row{ grid-template-columns:repeat(4,1fr); } }
  .stat{ display:flex; flex-direction:column; gap:2px; }
  .stat .label{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-text-dim); }
  .stat .value{ font-size:14px; color:var(--ink-text); }
  .stat .value.jade{ color:var(--jade-1); font-family:var(--font-mono); }

  .modal-body{ padding:22px 20px 32px; display:flex; flex-direction:column; gap:26px; }
  @media (min-width:560px){ .modal-body{ padding:26px 30px 40px; } }

  .modal-section .section-label{
    font-family:var(--font-display); font-size:13px; letter-spacing:.2em;
    color:var(--sandal-0); margin-bottom:10px;
    display:flex; align-items:center; gap:10px;
  }
  .modal-section .section-label::after{
    content:""; flex:1; height:1px; background:var(--line-1);
  }
  .modal-section .synopsis{ font-size:13.5px; line-height:1.85; color:var(--ink-text); white-space:pre-line; }

  .info-grid{ display:grid; grid-template-columns:1fr; gap:10px; }
  @media (min-width:560px){ .info-grid{ grid-template-columns:1fr 1fr; gap:12px 24px; } }
  .info-row{ display:flex; justify-content:space-between; gap:16px; padding:9px 0; border-bottom:1px solid var(--line-1); font-size:12.5px; }
  .info-row .k{ color:var(--ink-text-dim); font-family:var(--font-mono); font-size:11px; letter-spacing:.04em; }
  .info-row .v{ color:var(--ink-text); text-align:right; }

  .trailer-wrap{
    position:relative; width:100%; aspect-ratio:16/9;
    border:1px solid var(--line-1); background:var(--ink-0);
    overflow:hidden;
  }
  .trailer-wrap iframe{ width:100%; height:100%; border:0; display:block; }

  .modal-loading, .modal-error{
    padding:80px 24px; text-align:center; color:var(--ink-text-dim); font-size:13px;
  }
  .modal-loading .spin{
    width:26px; height:26px; margin:0 auto 16px;
    border:1.5px solid var(--line-1); border-top-color:var(--jade-1);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  body.modal-open{ overflow:hidden; }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>

<!-- ============ INTRO SEQUENCE ============ -->
<div id="intro" role="status" aria-live="polite" aria-label="Loading KŌROKU">

<!-- ============ APP SHELL ============ -->
<div id="app">

  <header class="app-header">
    <button class="icon-btn" id="genreBtn" aria-label="Browse genres" aria-controls="genreDrawer">
      <i data-lucide="sparkles"></i>

      </button>

        <i data-lucide="menu"></i>
      </button>

  </header>

  <div class="control-bar">
    <label class="search-field">
      <span class="search-icon"><i data-lucide="search"></i></span>
      <input type="text" id="searchInput" placeholder="Search the archive…" autocomplete="off" aria-label="Search anime">

  <div class="results-label" id="resultsLabel">Loading top anime…</div>

  <main class="app-main" style="display:block; padding:0; align-items:initial;">

<!-- Drawers -->

    <li><a href="#">Watching</a></li>

<!-- ============ DETAIL MODAL ============ -->
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-label="Anime detail">
  <div class="modal-panel">
    <button class="modal-close" id="modalClose" aria-label="Close"><i data-lucide="x"></i></button>
    <div class="modal-scroll" id="modalScroll">
      <div class="modal-loading" id="modalLoading">
        <div class="spin"></div>
        <span>Retrieving record…</span>
      </div>
    </div>
  </div>
</div>

<script>
  // ---- Lucide icons (defensive: don't let a CDN hiccup break the rest of the script) ----
  function renderIcons(){
    if (window.lucide && typeof lucide.createIcons === 'function'){
      try { lucide.createIcons(); } catch(e){ console.warn('lucide render failed', e); }
    }
  }
  renderIcons();

  // ---- Theme toggle ----
  const root = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
  const saved = localStorage.getItem('koroku-theme');
  if (saved ? saved === 'light' : prefersLight){
    root.classList.add('light');
  }
  function refreshThemeIcon(){
    themeBtn.innerHTML = root.classList.contains('light')
      ? '<i data-lucide="moon"></i>'
      : '<i data-lucide="sun"></i>';
    renderIcons();
  }
  refreshThemeIcon();
  themeBtn.addEventListener('click', () => {
    root.classList.toggle('light');
    localStorage.setItem('koroku-theme', root.classList.contains('light') ? 'light' : 'dark');
    refreshThemeIcon();
  });

  // ---- Drawers ----
  const genreDrawer = document.getElementById('genreDrawer');
  const menuDrawer = document.getElementById('menuDrawer');
  const scrim = document.getElementById('scrim');

  function openDrawer(d){ d.classList.add('open'); scrim.classList.add('show'); }
  function closeDrawers(){
    genreDrawer.classList.remove('open');
    menuDrawer.classList.remove('open');
    scrim.classList.remove('show');
  }
  document.getElementById('genreBtn').addEventListener('click', () => openDrawer(genreDrawer));
  document.getElementById('menuBtn').addEventListener('click', () => openDrawer(menuDrawer));
  scrim.addEventListener('click', closeDrawers);
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDrawers(); });

  // ==================================================================
  // ---- Jikan API integration (https://api.jikan.moe/v4) ----
  // ==================================================================
  const JIKAN_BASE = 'https://api.jikan.moe/v4';

  const animeGrid   = document.getElementById('animeGrid');
  const paginationEl= document.getElementById('pagination');
  const resultsLabel= document.getElementById('resultsLabel');
  const searchInput = document.getElementById('searchInput');
  const genreList   = document.getElementById('genreList');
  const genreChip   = document.getElementById('genreChip');
  const genreChipLabel = document.getElementById('genreChipLabel');
  const genreChipClear = document.getElementById('genreChipClear');

  const state = {
    mode: 'top',      // 'top' | 'search' | 'genre'
    query: '',
    genreId: null,
    genreName: '',
    page: 1,
    lastPage: 1,
    requestToken: 0    // guards against out-of-order responses
  };

  // Jikan is rate-limited (~3 req/s, 60/min) — a tiny request queue keeps
  // rapid pagination/search/genre clicks from tripping 429s.
  let queueTail = Promise.resolve();
  function throttledFetch(url){
    const run = () => fetch(url).then(r => {
      if (!r.ok) throw new Error('Jikan request failed: ' + r.status);
      return r.json();
    });
    const result = queueTail.then(run, run);
    queueTail = result.then(() => new Promise(res => setTimeout(res, 360)), () => new Promise(res => setTimeout(res, 360)));
    return result;
  }

  function renderSkeletons(count = 12){
    animeGrid.innerHTML = Array.from({ length: count }).map(() => `
      <div class="anime-card skeleton">
        <div class="poster"></div>
        <div class="title"></div>
        <div class="meta"></div>
      </div>
    `).join('');
    paginationEl.innerHTML = '';
  }

  function renderGridState(message, icon = 'ghost'){
    animeGrid.innerHTML = `
      <div class="grid-state">
        <div class="mark"><i data-lucide="${icon}"></i></div>
        <p>${message}</p>
      </div>`;
    paginationEl.innerHTML = '';
    renderIcons();
  }

  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));
  }

  function renderCards(list){
    if (!list || list.length === 0){
      renderGridState('No titles turned up. Try another search or genre.', 'search-x');
      return;
    }
    animeGrid.innerHTML = list.map((anime, i) => {
      const title = escapeHtml(anime.title_english || anime.title || 'Untitled');
      const img = anime.images?.webp?.large_image_url || anime.images?.jpg?.large_image_url || '';
      const score = anime.score ? anime.score.toFixed(1) : null;
      const meta = [anime.type, anime.year].filter(Boolean).join(' · ');
      return `
        <button class="anime-card" data-id="${anime.mal_id}" type="button"
           style="animation-delay:${Math.min(i, 12) * 35}ms">
          <div class="poster">
            ${img ? `<img src="${img}" alt="${title}" loading="lazy">` : ''}
            ${score ? `<span class="score"><svg viewBox="0 0 24 24"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>${score}</span>` : ''}
          </div>
          <div class="title">${title}</div>
          <div class="meta">${escapeHtml(meta)}</div>
        </button>`;
    }).join('');
    animeGrid.querySelectorAll('.anime-card[data-id]').forEach(card => {
      card.addEventListener('click', () => openModal(Number(card.dataset.id)));
    });
  }

  function renderPagination(){
    const { page, lastPage } = state;
    if (lastPage <= 1){ paginationEl.innerHTML = ''; return; }

    const pages = new Set([1, lastPage, page, page - 1, page + 1]);
    const sorted = [...pages].filter(p => p >= 1 && p <= lastPage).sort((a,b) => a-b);

    let html = `<button class="page-btn" id="prevPage" ${page <= 1 ? 'disabled' : ''} aria-label="Previous page">‹</button>`;
    let prev = 0;
    for (const p of sorted){
      if (prev && p - prev > 1) html += `<span class="page-ellipsis">···</span>`;
      html += `<button class="page-btn ${p === page ? 'active' : ''}" data-page="${p}">${p}</button>`;
      prev = p;
    }
    html += `<button class="page-btn" id="nextPage" ${page >= lastPage ? 'disabled' : ''} aria-label="Next page">›</button>`;
    paginationEl.innerHTML = html;

    paginationEl.querySelectorAll('[data-page]').forEach(btn => {
      btn.addEventListener('click', () => goToPage(Number(btn.dataset.page)));
    });
    document.getElementById('prevPage')?.addEventListener('click', () => goToPage(page - 1));
    document.getElementById('nextPage')?.addEventListener('click', () => goToPage(page + 1));
  }

  function goToPage(p){
    if (p < 1 || p === state.page) return;
    state.page = p;
    loadAnime();
    animeGrid.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function buildUrl(){
    const params = new URLSearchParams();
    params.set('page', state.page);
    params.set('limit', '18');
    params.set('sfw', 'true');

    if (state.mode === 'search'){
      params.set('q', state.query);
      params.set('order_by', 'popularity');
      return `${JIKAN_BASE}/anime?${params.toString()}`;
    }
    if (state.mode === 'genre'){
      params.set('genres', state.genreId);
      params.set('order_by', 'popularity');
      return `${JIKAN_BASE}/anime?${params.toString()}`;
    }
    // default: top/popular anime
    params.set('filter', 'bypopularity');
    return `${JIKAN_BASE}/top/anime?${params.toString()}`;
  }

  function updateResultsLabel(){
    if (state.mode === 'search') resultsLabel.textContent = `Results for "${state.query}"`;
    else if (state.mode === 'genre') resultsLabel.textContent = `Genre — ${state.genreName}`;
    else resultsLabel.textContent = 'Top anime, by popularity';
  }

  async function loadAnime(){
    const token = ++state.requestToken;
    updateResultsLabel();
    renderSkeletons();

    try {
      const data = await throttledFetch(buildUrl());
      if (token !== state.requestToken) return; // a newer request superseded this one

      renderCards(data.data);
      state.lastPage = data.pagination?.last_visible_page || 1;
      renderPagination();
    } catch (err){
      if (token !== state.requestToken) return;
      console.error(err);
      renderGridState('The archive is unreachable right now. Please try again shortly.', 'wifi-off');
    }
  }

  // ---- Search (debounced) ----
  let searchTimer = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const value = searchInput.value.trim();
    searchTimer = setTimeout(() => {
      state.page = 1;
      if (value.length === 0){
        state.mode = state.genreId ? 'genre' : 'top';
        state.query = '';
      } else {
        state.mode = 'search';
        state.query = value;
        // typing a search clears any active genre filter
        state.genreId = null;
        genreChip.classList.remove('show');
      }
      loadAnime();
    }, 500); // debounce
  });

  // ---- Genre overlay ----
  async function loadGenres(){
    try {
      const data = await throttledFetch(`${JIKAN_BASE}/genres/anime`);
      const genres = (data.data || [])
        .filter(g => g.count > 0)
        .sort((a,b) => b.count - a.count)
        .slice(0, 24)
        .sort((a,b) => a.name.localeCompare(b.name));

      genreList.innerHTML = genres.map(g => `
        <button class="genre-item" data-id="${g.mal_id}" data-name="${escapeHtml(g.name)}">
          <span>${escapeHtml(g.name)}</span>
          <span class="count">${g.count}</span>
        </button>`).join('');

      genreList.querySelectorAll('.genre-item').forEach(btn => {
        btn.addEventListener('click', () => {
          genreList.querySelectorAll('.genre-item').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectGenre(Number(btn.dataset.id), btn.dataset.name);
        });
      });
    } catch (err){
      console.error(err);
      genreList.innerHTML = `<div class="genre-loading">Genres unavailable — check your connection.</div>`;
    }
  }

  function selectGenre(id, name){
    state.mode = 'genre';
    state.genreId = id;
    state.genreName = name;
    state.query = '';
    state.page = 1;
    searchInput.value = '';
    genreChipLabel.textContent = name;
    genreChip.classList.add('show');
    closeDrawers();
    loadAnime();
  }

  genreChipClear.addEventListener('click', () => {
    state.mode = 'top';
    state.genreId = null;
    state.page = 1;
    genreChip.classList.remove('show');
    genreList.querySelectorAll('.genre-item').forEach(b => b.classList.remove('active'));
    loadAnime();
  });

  // ---- Initial load ----
  loadGenres();
  loadAnime();

  // ==================================================================
  // ---- Detail modal ----
  // ==================================================================
  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalScroll   = document.getElementById('modalScroll');
  const modalClose    = document.getElementById('modalClose');
  let modalToken = 0;
  let lastFocused = null;

  function openModal(id){
    modalToken++;
    const token = modalToken;
    lastFocused = document.activeElement;

    modalScroll.innerHTML = `
      <div class="modal-loading">
        <div class="spin"></div>
        <span>Retrieving record…</span>
      </div>`;
    document.body.classList.add('modal-open');
    modalBackdrop.classList.remove('closing');
    requestAnimationFrame(() => modalBackdrop.classList.add('open'));
    modalClose.focus({ preventScroll: true });

    throttledFetch(`${JIKAN_BASE}/anime/${id}/full`)
      .then(data => {
        if (token !== modalToken) return;
        renderModal(data.data);
      })
      .catch(err => {
        if (token !== modalToken) return;
        console.error(err);
        modalScroll.innerHTML = `
          <div class="modal-error">
            <p>Couldn't retrieve this record. Please try again shortly.</p>
          </div>`;
      });
  }

  function closeModal(){
    modalBackdrop.classList.add('closing');
    modalBackdrop.classList.remove('open');
    document.body.classList.remove('modal-open');
    modalToken++; // invalidate any in-flight fetch
    setTimeout(() => {
      modalBackdrop.classList.remove('closing');
      modalScroll.innerHTML = '';
    }, 420);
    if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus({ preventScroll: true });
  }

  modalClose.addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', e => {
    if (e.target === modalBackdrop) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modalBackdrop.classList.contains('open')) closeModal();
  });

  function youtubeEmbed(ytId){
    if (!ytId) return '';
    return `
      <div class="modal-section">
        <div class="section-label">Trailer</div>
        <div class="trailer-wrap">
          <iframe src="https://www.youtube.com/embed/${ytId}" title="Trailer"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen loading="lazy"></iframe>
        </div>
      </div>`;
  }

  function renderModal(a){
    const title = escapeHtml(a.title_english || a.title || 'Untitled');
    const jpTitle = a.title_japanese ? escapeHtml(a.title_japanese) : '';
    const img = a.images?.webp?.large_image_url || a.images?.jpg?.large_image_url || '';
    const genres = [...(a.genres||[]), ...(a.themes||[]), ...(a.demographics||[])].map(g => g.name);
    const studios = (a.studios||[]).map(s => s.name).join(', ') || '—';
    const producers = (a.producers||[]).map(s => s.name).join(', ') || '—';
    const score = a.score ? a.score.toFixed(2) : '—';
    const rank = a.rank ? `#${a.rank}` : '—';
    const popularity = a.popularity ? `#${a.popularity}` : '—';
    const members = a.members ? a.members.toLocaleString() : '—';
    const aired = a.aired?.string || '—';
    const synopsis = a.synopsis ? escapeHtml(a.synopsis) : 'No synopsis available for this title yet.';
    const ytId = a.trailer?.youtube_id || '';

    modalScroll.innerHTML = `
      <div class="modal-hero">
        <div class="backdrop-fade"></div>
        ${img ? `<img class="poster-img" src="${img}" alt="${title}">` : `<div class="poster-img"></div>`}
        <div class="modal-hero-info">
          ${jpTitle ? `<div class="jp-title">${jpTitle}</div>` : ''}
          <h2>${title}</h2>
          <div class="modal-tags">
            ${genres.map(g => `<span class="modal-tag">${escapeHtml(g)}</span>`).join('')}
          </div>
          <div class="stat-row">
            <div class="stat"><span class="label">Score</span><span class="value jade">${score}</span></div>
            <div class="stat"><span class="label">Rank</span><span class="value">${rank}</span></div>
            <div class="stat"><span class="label">Episodes</span><span class="value">${a.episodes ?? '—'}</span></div>
            <div class="stat"><span class="label">Status</span><span class="value">${escapeHtml(a.status || '—')}</span></div>
          </div>
        </div>
      </div>

      <div class="modal-body">
        <div class="modal-section">
          <div class="section-label">Synopsis</div>
          <p class="synopsis">${synopsis}</p>
        </div>

        ${youtubeEmbed(ytId)}

        <div class="modal-section">
          <div class="section-label">Details</div>
          <div class="info-grid">
            <div class="info-row"><span class="k">Type</span><span class="v">${escapeHtml(a.type || '—')}</span></div>
            <div class="info-row"><span class="k">Aired</span><span class="v">${escapeHtml(aired)}</span></div>
            <div class="info-row"><span class="k">Studios</span><span class="v">${escapeHtml(studios)}</span></div>
            <div class="info-row"><span class="k">Producers</span><span class="v">${escapeHtml(producers)}</span></div>
            <div class="info-row"><span class="k">Source</span><span class="v">${escapeHtml(a.source || '—')}</span></div>
            <div class="info-row"><span class="k">Duration</span><span class="v">${escapeHtml(a.duration || '—')}</span></div>
            <div class="info-row"><span class="k">Rating</span><span class="v">${escapeHtml(a.rating || '—')}</span></div>
            <div class="info-row"><span class="k">Popularity</span><span class="v">${popularity}</span></div>
            <div class="info-row"><span class="k">Members</span><span class="v">${members}</span></div>
            <div class="info-row"><span class="k">Favorites</span><span class="v">${a.favorites ? a.favorites.toLocaleString() : '—'}</span></div>
          </div>
        </div>

        ${a.url ? `
        <div class="modal-section">
          <div class="section-label">Reference</div>
          <a href="${a.url}" target="_blank" rel="noopener" style="color:var(--jade-1); font-size:12.5px; text-decoration:underline; text-underline-offset:3px;">
            View full record on MyAnimeList ↗
          </a>
        </div>` : ''}
      </div>
    `;
    renderIcons();
  }

  // ---- Intro sequence: 0% -> 100% then fade ----
  const pctEl = document.getElementById('pctNum');
  const introEl = document.getElementById('intro');
  const appEl = document.getElementById('app');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function runIntro(){
    if (reduceMotion){
      pctEl.textContent = '100%';
      finishIntro();
      return;
    }
    const duration = 2600; // ms
    const start = performance.now();
    function tick(now){
      const t = Math.min(1, (now - start) / duration);
      // ease-out-ish curve, with a little settle near the end
      const eased = t < 0.85
        ? t / 0.85 * 0.94
        : 0.94 + (t - 0.85) / 0.15 * 0.06;
      const pct = Math.round(eased * 100);
      pctEl.textContent = pct + '%';
      if (t < 1){
        requestAnimationFrame(tick);
      } else {
        pctEl.textContent = '100%';
        setTimeout(finishIntro, 320);
      }
    }
    requestAnimationFrame(tick);
  }

  function finishIntro(){
    introEl.classList.add('fade-out');
    appEl.classList.add('visible');
    setTimeout(() => { introEl.style.display = 'none'; }, 950);
  }

  // Fires 'load' can be missed if it already happened before this script ran
  // (common on fast static hosts). Cover all cases + add a hard fallback.
  if (document.readyState === 'complete'){
    runIntro();
  } else {
    window.addEventListener('load', runIntro);
  }
  // Safety net: never let the app stay stuck behind the intro.
  setTimeout(() => {
    if (!appEl.classList.contains('visible')) finishIntro();
  }, 4500);
</script>

</body>
</html>
